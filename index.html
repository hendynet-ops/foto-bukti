<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Foto Bukti">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Foto Bukti</title>
<style>
:root{--bg:#111418;--fg:#f2f4f6;--mut:#9aa3ad;--ok:#3ddc97;--warn:#ffb000;--bad:#ff5c5c;--chip:rgba(17,20,24,.72)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#stage{position:relative;flex:1;min-height:0;background:#000;overflow:hidden}
video{width:100%;height:100%;object-fit:cover;display:block}
.top{position:absolute;left:0;right:0;top:0;padding:10px}
.chip{display:inline-block;background:var(--chip);border-radius:10px;padding:6px 10px;font-size:13px;font-variant-numeric:tabular-nums}
.chip b{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--bad);margin-right:6px}
.chip.ok b{background:var(--ok)}.chip.warn b{background:var(--warn)}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:32px;color:var(--mut)}
#msg[hidden]{display:none}
#ovl{position:absolute;left:10px;right:70px;bottom:8px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9);font-size:12px;line-height:1.3;pointer-events:none}
#ovl img{height:30px;display:block;margin-bottom:4px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
#ovl .big{font-size:15px;font-weight:700}
#cmpw{position:absolute;right:10px;bottom:8px;width:48px;text-align:center;color:#fff;font-weight:700;font-size:13px;text-shadow:0 1px 3px #000;display:none}
#cmpw svg{width:44px;height:44px;display:block;margin:0 auto}
#hist{display:flex;gap:6px;overflow-x:auto;padding:8px 10px 0;min-height:0}
.th{position:relative;flex:none;height:48px;width:48px}
.th img{height:48px;width:48px;object-fit:cover;border-radius:8px;border:1px solid #2a3038;display:block}
.th i{position:absolute;left:2px;bottom:2px;background:rgba(0,0,0,.75);font:600 10px/1 system-ui,sans-serif;padding:2px 3px;border-radius:4px;font-style:normal}
.th.on img{border:3px solid var(--ok)}
.th.on::after{content:attr(data-n);position:absolute;right:2px;top:2px;background:var(--ok);color:#000;font:700 11px/16px system-ui,sans-serif;min-width:16px;text-align:center;border-radius:8px}
#bar{padding:8px 14px calc(12px + env(safe-area-inset-bottom,0px));display:grid;gap:8px}
.in{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input,select{width:100%;background:#1b2027;color:var(--fg);border:1px solid #2a3038;border-radius:10px;padding:10px 12px;font:inherit}
.row{display:flex;align-items:center;justify-content:space-between}
button{font:inherit;color:var(--fg);background:#1b2027;border:1px solid #2a3038;border-radius:10px;padding:10px 14px;min-width:84px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
.seg{display:flex;border:1px solid #2a3038;border-radius:10px;overflow:hidden}
.seg button{flex:1;min-width:0;border:0;border-radius:0;padding:10px 4px}
.seg button.on{background:var(--fg);color:var(--bg);font-weight:600}
#selbar{display:none}
#app.sel #selbar{display:flex;gap:8px;align-items:center}
#app.sel #main{display:none}
#selbar span{flex:1;color:var(--mut);font-size:13px}
#selbar button{min-width:0}
button.pri{background:var(--ok);color:#000;border-color:var(--ok);font-weight:600}
#again{position:fixed;left:50%;top:40%;transform:translateX(-50%);padding:14px 22px;box-shadow:0 4px 20px rgba(0,0,0,.6)}
#again[hidden]{display:none}
#shot{width:74px;height:74px;border-radius:50%;border:4px solid #fff;background:#fff;padding:0;min-width:0;box-shadow:inset 0 0 0 4px var(--bg)}
#shot:disabled{opacity:.3}
#shot:active:not(:disabled){transform:scale(.94)}
#toast{position:fixed;left:50%;top:calc(56px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <video id="v" autoplay playsinline muted></video>
    <div id="msg">Mengaktifkan kamera…</div>
    <div class="top"><div class="chip" id="gps"><b></b><span>Mencari lokasi…</span></div></div>
    <div id="ovl"><img src="logo.png" alt=""><div id="ovt"></div></div>
    <div id="cmpw"><svg viewBox="-30 -30 60 60"><circle r="28" fill="rgba(0,0,0,.35)"/><polygon id="arr" points="0,-22 11,10 0,3 -11,10" fill="#fff"/></svg>N</div>
  </div>
  <div id="hist"></div>
  <div id="bar">
    <div class="in">
      <input id="loc" type="text" placeholder="Lokasi / proyek" maxlength="60" autocomplete="off">
      <input id="note" type="text" placeholder="Catatan" maxlength="80" autocomplete="off">
    </div>
    <div class="in">
      <select id="job" aria-label="Pekerjaan"><option value="">Tanpa pekerjaan</option></select>
      <div class="seg" id="ph"><button data-v="Sebelum">Sebelum</button><button data-v="Sesudah">Sesudah</button></div>
    </div>
    <div class="row" id="main">
      <button id="flip">Balik kamera</button>
      <button id="shot" disabled aria-label="Ambil foto"></button>
      <button id="selon">Form A4</button>
    </div>
    <div id="selbar">
      <button id="seloff">Batal</button>
      <span id="selc">Ketuk foto untuk memilih</span>
      <button id="del">Hapus</button>
      <button id="mk" class="pri">Buat PDF</button>
    </div>
  </div>
</div>
<button id="again" class="pri" hidden>Simpan / bagikan</button>
<div id="toast" role="status"></div>
<script>
const $ = s => document.querySelector(s);
const v = $('#v'), msg = $('#msg'), gpsEl = $('#gps'), shot = $('#shot'), hist = $('#hist'), locI = $('#loc'), noteI = $('#note');
const IOS = /iP(hone|ad|od)/.test(navigator.userAgent);
const logo = new Image(); logo.src = 'logo.png';
let stream, facing = 'environment', pos = null, heading = null, addr = '', addrAt = null, addrT = 0;

['loc', 'note'].forEach(k => { const e = $('#' + k); e.value = localStorage.getItem(k) || ''; e.addEventListener('input', () => { localStorage.setItem(k, e.value); ovRefresh(); }); });

/* Pekerjaan + Sebelum/Sesudah (dipakai untuk menyusun form A4) */
const JOBS = ['Instalasi RAM', 'Instalasi SSD', 'Cleaning Internal & Eksternal PC', 'Pemeriksaan Keyboard & Mouse', 'Pemeriksaan Network'];
const jobI = $('#job');
JOBS.forEach(j => jobI.add(new Option(j, j)));
jobI.value = JOBS.includes(localStorage.getItem('job')) ? localStorage.getItem('job') : '';
jobI.onchange = () => localStorage.setItem('job', jobI.value);
let phase = localStorage.getItem('ph') === 'Sesudah' ? 'Sesudah' : 'Sebelum';
const phSet = p => { phase = p; localStorage.setItem('ph', p); document.querySelectorAll('#ph button').forEach(b => b.classList.toggle('on', b.dataset.v === p)); };
document.querySelectorAll('#ph button').forEach(b => b.onclick = () => phSet(b.dataset.v));
phSet(phase);

const p2 = n => String(n).padStart(2, '0');
const tz = d => ({ '-420': 'WIB', '-480': 'WITA', '-540': 'WIT' })[d.getTimezoneOffset()] || 'GMT' + (d.getTimezoneOffset() <= 0 ? '+' : '-') + Math.abs(d.getTimezoneOffset() / 60);
const fmt = d => `${p2(d.getDate())}.${p2(d.getMonth() + 1)}.${d.getFullYear()} ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())} ${tz(d)}`;
const toast = t => { const e = $('#toast'); e.textContent = t; e.classList.add('on'); setTimeout(() => e.classList.remove('on'), 2600); };

/* Plus Code (Open Location Code), format pendek: RR9M+RC5 */
function olc(lat, lng) {
  const A = '23456789CFGHJMPQRVWX';
  let la = Math.floor((Math.min(lat, 89.999999) + 90) * 40000), lo = Math.floor((((lng + 180) % 360 + 360) % 360) * 32000);
  const g = (la % 5) * 4 + (lo % 4); la = Math.floor(la / 5); lo = Math.floor(lo / 4);
  let s = '';
  for (let i = 0; i < 5; i++) { s = A[lo % 20] + s; s = A[la % 20] + s; la = Math.floor(la / 20); lo = Math.floor(lo / 20); }
  return s.slice(4, 8) + '+' + s.slice(8) + A[g];
}

/* Isi teks tag (dipakai preview dan foto) */
function lines(now) {
  const L = [], l = locI.value.trim(), n = noteI.value.trim();
  if (l) L.push({ t: l, big: 1 });
  if (n) L.push({ t: n });
  L.push({ t: fmt(now) });
  if (pos) {
    const c = pos.coords;
    L.push({ t: `${c.latitude.toFixed(5)}, ${c.longitude.toFixed(5)} (±${Math.round(c.accuracy)} m)` });
    L.push({ t: olc(c.latitude, c.longitude) + (addr ? ', ' + addr : '') });
  }
  return L;
}
function ovRefresh() {
  const o = $('#ovt'); o.innerHTML = '';
  lines(new Date()).forEach(l => { const d = document.createElement('div'); if (l.big) d.className = 'big'; d.textContent = l.t; o.appendChild(d); });
}

/* Kamera */
async function startCam() {
  try {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    v.srcObject = stream; msg.hidden = true; refresh();
  } catch (e) {
    msg.hidden = false; msg.textContent = 'Kamera tidak bisa dibuka. Izinkan akses kamera di pengaturan situs, lalu muat ulang halaman.';
  }
}
$('#flip').onclick = () => { facing = facing === 'environment' ? 'user' : 'environment'; startCam(); };

/* GPS */
function startGps() {
  if (!navigator.geolocation) { gpsEl.lastChild.textContent = 'GPS tidak didukung'; return; }
  navigator.geolocation.watchPosition(p => { pos = p; refresh(); getAddr(); }, err => {
    pos = null; gpsEl.className = 'chip';
    gpsEl.lastChild.textContent = err.code === 1 ? 'Izin lokasi ditolak' : 'Lokasi belum tersedia'; refresh();
  }, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
}
function refresh() {
  if (pos) {
    const a = Math.round(pos.coords.accuracy);
    gpsEl.className = 'chip ' + (a <= 20 ? 'ok' : a <= 50 ? 'warn' : '');
    gpsEl.lastChild.textContent = `GPS ±${a} m`;
  }
  shot.disabled = !(pos && stream && v.videoWidth);
  ovRefresh();
}
setInterval(() => { refresh(); getAddr(); }, 1000);

/* Alamat (butuh internet; OpenStreetMap Nominatim) */
const dist = (a, b) => Math.hypot((a.latitude - b.latitude) * 111320, (a.longitude - b.longitude) * 111320 * Math.cos(a.latitude * Math.PI / 180));
async function getAddr() {
  if (!pos || !navigator.onLine) return;
  const c = pos.coords, now = Date.now();
  if (addr && addrAt && dist(addrAt, c) < 25) return;
  if (now - addrT < 15000) return;
  addrT = now;
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&accept-language=id&lat=${c.latitude}&lon=${c.longitude}`);
    const j = await r.json(), a = j.address || {};
    const parts = [[a.road, a.house_number].filter(Boolean).join(' '), a.neighbourhood, a.suburb || a.village, a.city_district, a.city || a.town || a.county, a.postcode].filter(Boolean);
    addr = [...new Set(parts)].join(', ') || j.display_name || '';
    addrAt = { latitude: c.latitude, longitude: c.longitude };
  } catch (e) {}
}

/* Kompas */
function onOri(e) {
  let h = null;
  if (e.webkitCompassHeading != null) h = e.webkitCompassHeading;
  else if (e.absolute && e.alpha != null) h = 360 - e.alpha;
  if (h == null) return;
  heading = (h + 360) % 360;
  $('#cmpw').style.display = 'block';
  $('#arr').setAttribute('transform', `rotate(${-heading})`);
}
addEventListener('deviceorientationabsolute', onOri, true);
addEventListener('deviceorientation', onOri, true);
async function askOri() {
  if (askOri.d) return; askOri.d = 1;
  if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) { try { await DeviceOrientationEvent.requestPermission(); } catch (e) {} }
}
document.addEventListener('click', askOri, { once: true });

/* Ambil foto */
function wrap(x, t, maxW) {
  const out = []; let cur = '';
  for (const w of t.split(' ')) { const tt = cur ? cur + ' ' + w : w; if (x.measureText(tt).width > maxW && cur) { out.push(cur); cur = w; } else cur = tt; }
  out.push(cur); return out;
}
shot.onclick = () => {
  askOri();
  const sc = Math.min(1, 1600 / v.videoWidth), w = Math.round(v.videoWidth * sc), h = Math.round(v.videoHeight * sc);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.drawImage(v, 0, 0, w, h);
  const now = new Date(), fs = Math.max(14, Math.round(w / 34)), m = Math.round(w * .035), lh = fs * 1.3;
  const font = big => `${big ? 700 : 500} ${big ? fs * 1.25 : fs}px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif`;
  x.textBaseline = 'top';
  const rows = [];
  lines(now).forEach(l => { x.font = font(l.big); wrap(x, l.t, w - m * 2 - fs * 3.6).forEach(t => rows.push({ t, big: l.big })); });
  const rh = r => r.big ? lh * 1.25 : lh;
  let y = h - m - rows.reduce((s, r) => s + rh(r), 0);
  x.shadowColor = 'rgba(0,0,0,.85)'; x.shadowBlur = fs * .25; x.shadowOffsetY = fs * .05;
  if (logo.complete && logo.naturalWidth) { const lH = fs * 2.2; x.drawImage(logo, m, y - lH - fs * .3, lH * logo.naturalWidth / logo.naturalHeight, lH); }
  x.fillStyle = '#fff';
  rows.forEach(r => { x.font = font(r.big); x.fillText(r.t, m, y); y += rh(r); });
  if (heading != null) {
    const r = fs * 1.1, cx = w - m - r, cy = h - m - fs * 1.5 - r;
    x.save(); x.translate(cx, cy);
    x.fillStyle = 'rgba(0,0,0,.35)'; x.beginPath(); x.arc(0, 0, r, 0, 7); x.fill();
    x.rotate(-heading * Math.PI / 180); x.fillStyle = '#fff'; x.beginPath();
    x.moveTo(0, -r * .8); x.lineTo(r * .4, r * .35); x.lineTo(0, r * .12); x.lineTo(-r * .4, r * .35); x.closePath(); x.fill();
    x.restore();
    x.font = `700 ${fs * 1.1}px system-ui,sans-serif`; x.textAlign = 'center'; x.fillText('N', cx, cy + r + fs * .15); x.textAlign = 'left';
  }
  const name = `foto_${now.getFullYear()}${p2(now.getMonth() + 1)}${p2(now.getDate())}_${p2(now.getHours())}${p2(now.getMinutes())}${p2(now.getSeconds())}.jpg`;
  const meta = { job: jobI.value, ph: jobI.value ? phase : '', note: noteI.value.trim(), loc: locI.value.trim() };
  c.toBlob(async b => { await dbAdd({ blob: b, name, t: now.getTime(), ...meta }); await output(b, name); renderHist(); }, 'image/jpeg', .88);
};

async function output(blob, name) {
  const type = blob.type || 'image/jpeg', file = new File([blob], name, { type });
  if (IOS && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); toast(type === 'application/pdf' ? 'Pilih “Simpan ke File” untuk menyimpan PDF' : 'Pilih “Simpan Gambar” untuk ke Foto'); }
    catch (e) {
      // Safari menolak share bila jeda sejak ketukan terlalu lama (mis. PDF lama dibuat): minta ketukan baru
      if (e.name === 'NotAllowedError') { const a = $('#again'); a.hidden = false; a.onclick = () => { a.hidden = true; output(blob, name); }; }
    }
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('Tersimpan: ' + name);
}

/* Riwayat (IndexedDB) */
const db = new Promise((res, rej) => {
  const r = indexedDB.open('fotobukti', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('p', { autoIncrement: true });
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
const tx = async (m, f) => { const d = await db; return new Promise((res, rej) => { const q = f(d.transaction('p', m).objectStore('p')); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); };
const dbAdd = item => tx('readwrite', s => s.add(item)).catch(() => {});
let items = [], sel = [], selMode = false;
async function renderHist() {
  let all = [], keys = [];
  try { all = await tx('readonly', s => s.getAll()); keys = await tx('readonly', s => s.getAllKeys()); } catch (e) {}
  items = all.map((it, k) => ({ ...it, key: keys[k] })).slice(-100).reverse();
  sel = sel.filter(k => items.some(it => it.key === k));
  hist.querySelectorAll('img').forEach(i => URL.revokeObjectURL(i.src));
  hist.innerHTML = '';
  items.forEach(it => {
    const d = document.createElement('div'); d.className = 'th';
    const i = new Image(); i.src = URL.createObjectURL(it.blob); i.alt = it.name; d.appendChild(i);
    if (it.job) { const b = document.createElement('i'); b.textContent = (JOBS.indexOf(it.job) + 1 || '•') + (it.ph === 'Sesudah' ? ' Ssd' : ' Sbl'); d.appendChild(b); }
    d.title = it.job ? `${it.job} - ${it.ph}` : 'Ketuk untuk simpan/bagikan lagi';
    d.onclick = () => {
      if (!selMode) return output(it.blob, it.name);
      const n = sel.indexOf(it.key); n < 0 ? sel.push(it.key) : sel.splice(n, 1); selShow();
    };
    d.dataset.key = it.key; hist.appendChild(d);
  });
  selShow();
}
function selShow() {
  hist.querySelectorAll('.th').forEach(d => { const n = sel.indexOf(+d.dataset.key); d.classList.toggle('on', n >= 0); d.dataset.n = n + 1; });
  $('#selc').textContent = sel.length ? `${sel.length} foto dipilih` : 'Ketuk foto untuk memilih';
  $('#del').textContent = sel.length ? 'Hapus' : 'Hapus semua';
}
const selSet = on => { selMode = on; sel = []; $('#app').classList.toggle('sel', on); selShow(); };
$('#selon').onclick = () => { if (!items.length) return toast('Belum ada foto di riwayat'); selSet(true); toast('Ketuk foto yang akan dimasukkan ke form'); };
$('#seloff').onclick = () => selSet(false);
$('#del').onclick = async () => {
  if (!sel.length) {
    if (confirm('Hapus semua riwayat di dalam aplikasi? Foto di galeri tidak ikut terhapus.')) { await tx('readwrite', s => s.clear()); selSet(false); renderHist(); }
  } else if (confirm(`Hapus ${sel.length} foto dari riwayat aplikasi? Foto di galeri tidak ikut terhapus.`)) {
    for (const k of sel) await tx('readwrite', s => s.delete(k));
    sel = []; renderHist();
  }
};

/* Form A4: 2 x 2 foto per halaman, dirender ke canvas lalu dibungkus jadi PDF (tanpa library) */
const kop = new Image(); kop.src = 'kop.png'; // kop tetap, dipotong dari aset/From Foto Pekerjaan.png
$('#mk').onclick = async () => {
  if (!sel.length) return toast('Pilih foto dulu');
  const lok = items.find(it => it.key === sel[0]).loc || locI.value.trim();
  toast('Membuat PDF…');
  try {
    const now = new Date(), blob = await makeForm(lok, items.filter(it => sel.includes(it.key)));
    await output(blob, `form_foto_${now.getFullYear()}${p2(now.getMonth() + 1)}${p2(now.getDate())}_${p2(now.getHours())}${p2(now.getMinutes())}${p2(now.getSeconds())}.pdf`);
    selSet(false);
  } catch (e) { toast('Gagal membuat PDF: ' + e.message); }
};

const loadImg = b => new Promise((res, rej) => { const i = new Image(), u = URL.createObjectURL(b); i.onload = () => { URL.revokeObjectURL(u); res(i); }; i.onerror = () => { URL.revokeObjectURL(u); rej(new Error('gambar tidak terbaca')); }; i.src = u; });

/* Baris form: tiap pekerjaan jadi pasangan Sebelum | Sesudah, foto tanpa pekerjaan diisi berurutan */
function formRows(list) {
  list = [...list].sort((a, b) => a.t - b.t);
  const rows = [], jobs = [...JOBS, ...new Set(list.map(i => i.job).filter(j => j && !JOBS.includes(j)))];
  jobs.forEach(j => {
    const a = list.filter(i => i.job === j && i.ph !== 'Sesudah'), b = list.filter(i => i.job === j && i.ph === 'Sesudah');
    for (let k = 0; k < Math.max(a.length, b.length); k++) rows.push([{ label: j + ' - Sebelum', it: a[k] }, { label: j + ' - Sesudah', it: b[k] }]);
  });
  const rest = list.filter(i => !i.job);
  rest.forEach((it, k) => { const c = { label: it.note || `Foto ${k + 1}`, it }; k % 2 ? rows[rows.length - 1].push(c) : rows.push([c]); });
  return rows;
}

const PW = 1654, PH = 2339, K = PW / 210; // A4 pada 200 dpi, K = piksel per mm
const FONT = 'system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
function txt(x, t, X, Y, maxW, size, weight = 400, align = 'left') {
  let s = size;
  for (;;) { x.font = `${weight} ${s * K}px ${FONT}`; if (s <= size * .6 || x.measureText(t).width <= maxW * K) break; s -= .2; }
  x.textAlign = align; x.fillText(t, X * K, Y * K, maxW * K);
}
function contain(x, img, X, Y, W, H) {
  const s = Math.min(W * K / img.naturalWidth, H * K / img.naturalHeight), w = img.naturalWidth * s, h = img.naturalHeight * s;
  x.drawImage(img, X * K + (W * K - w) / 2, Y * K + (H * K - h) / 2, w, h);
}
async function drawPage(lok, rows, pg, n, made) {
  const c = document.createElement('canvas'); c.width = PW; c.height = PH;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, PW, PH);
  x.strokeStyle = '#222'; x.lineWidth = .3 * K; x.fillStyle = '#231f20'; x.textBaseline = 'middle';
  const box = (X, Y, W, H) => x.strokeRect(X * K, Y * K, W * K, H * K);
  const M = 8, CW = 210 - 2 * M, HH = CW * kop.naturalHeight / kop.naturalWidth;
  x.drawImage(kop, M * K, M * K, CW * K, HH * K);
  txt(x, 'LOKASI : ' + (lok || '-'), M, M + HH + 5, CW, 4.5, 700);
  // Grid 2 x 2
  const top = M + HH + 10, bot = 297 - M - 6, gap = 4, lab = 8, rowH = (bot - top - gap) / 2, colW = (CW - 5) / 2;
  for (let r = 0; r < rows.length; r++) {
    for (let k = 0; k < rows[r].length; k++) {
      const cell = rows[r][k], X = M + k * (colW + 5), Y = top + r * (rowH + gap);
      x.fillStyle = '#231f20'; txt(x, cell.label, X, Y + lab / 2, colW, 5, 700);
      box(X, Y + lab, colW, rowH - lab);
      if (cell.it) contain(x, await loadImg(cell.it.blob), X + 1, Y + lab + 1, colW - 2, rowH - lab - 2);
    }
  }
  x.fillStyle = '#777'; txt(x, `Dibuat ${made} · Halaman ${pg} dari ${n}`, 105, 297 - 5, CW, 2.8, 400, 'center');
  const b = await new Promise(res => c.toBlob(res, 'image/jpeg', .85));
  return { jpg: new Uint8Array(await b.arrayBuffer()), w: PW, h: PH };
}
async function makeForm(lok, list) {
  const rows = formRows(list), n = Math.ceil(rows.length / 2), pages = [], made = fmt(new Date()).slice(0, 10);
  await kop.decode();
  for (let p = 0; p < n; p++) pages.push(await drawPage(lok, rows.slice(p * 2, p * 2 + 2), p + 1, n, made));
  return pdf(pages);
}
/* PDF minimal: satu gambar JPEG (DCTDecode) penuh per halaman A4 */
function pdf(pages) {
  const enc = new TextEncoder(), parts = [], off = []; let len = 0;
  const put = d => { if (typeof d === 'string') d = enc.encode(d); parts.push(d); len += d.length; };
  const obj = (o, body, stream) => { off[o] = len; put(`${o} 0 obj\n${body}\n`); if (stream) { put('stream\n'); put(stream); put('\nendstream\n'); } put('endobj\n'); };
  put('%PDF-1.4\n'); put(new Uint8Array([37, 226, 227, 207, 211, 10]));
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obj(2, `<< /Type /Pages /Kids [${pages.map((_, i) => `${3 + i * 3} 0 R`).join(' ')}] /Count ${pages.length} >>`);
  pages.forEach((p, i) => {
    const o = 3 + i * 3, cs = 'q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
    obj(o, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 ${o + 2} 0 R >> >> /Contents ${o + 1} 0 R >>`);
    obj(o + 1, `<< /Length ${cs.length} >>`, cs);
    obj(o + 2, `<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.jpg.length} >>`, p.jpg);
  });
  const xref = len, size = 3 + pages.length * 3;
  put(`xref\n0 ${size}\n0000000000 65535 f \n` + off.slice(1).map(o => String(o).padStart(10, '0') + ' 00000 n \n').join(''));
  put(`trailer\n<< /Size ${size} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts, { type: 'application/pdf' });
}
